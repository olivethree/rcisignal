url: https://olivethree.github.io/rcisignal/
template:
  bootstrap: 5

reference:
- title: Build per-producer CIs
  desc: >
    Compute one classification image (CI) per producer from
    trial-level responses. Pass `group_by =` to also build
    group-averaged CIs in one call.
  contents:
  - ci_from_responses_briefrc
  - ci_from_responses_2ifc
  - group_ci

- title: Reliability and informational value
  desc: >
    Within-condition reliability of the per-producer signal and
    per-producer infoVal.
  contents:
  - infoval
  - rel_split_half
  - rel_split_half_null
  - rel_icc
  - rel_loo
  - rel_loo_z
  - run_reliability

- title: Between-condition discriminability
  desc: >
    Between-condition spatial difference: pixel-wise t, cluster-based
    permutation, Frobenius-distance bootstrap.
  contents:
  - pixel_t_test
  - rel_cluster_test
  - rel_dissimilarity
  - run_discriminability
  - run_discriminability_pairwise

- title: Cross-producer agreement
  desc: >
    Producer-level agreement maps (descriptive and FWE-controlled).
  contents:
  - agreement_map_test
  - plot_agreement_map

- title: Compare multiple CIs
  desc: >
    Cross-CI similarity, distance, and projection views. Accept any
    named collection of CIs (per-producer or group-level).
  contents:
  - plot_ci_correlogram
  - plot_ci_distance_matrix
  - plot_ci_mds

- title: Plot and export CIs
  contents:
  - plot_ci_overlay
  - plot_mask_overlay
  - plot_face_mask
  - plot_dissimilarity_grid
  - save_ci_images

- title: I/O and simulation
  contents:
  - read_responses
  - read_noise_matrix
  - read_cis
  - read_signal_matrix
  - extract_signal
  - simulate_briefrc_data
  - simulate_2ifc_data

- title: Data-quality diagnostics
  contents:
  - run_diagnostics
  - infoval_report
  - starts_with("check_")
  - validate_noise_matrix

- title: Helpers
  contents:
  - make_face_mask
  - read_face_mask
  - shift_mask
  - region_bounds_from_pixels
  - is_rcisignal_diag_result
  - rcisignal_diag_result
  - rcisignal_diag_report
